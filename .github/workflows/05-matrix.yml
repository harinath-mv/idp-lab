name: 05 matrix

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Show this combination
        shell: bash
        run: |
          echo "OS: ${{ matrix.os }}   Python asked: ${{ matrix.python }}"
          python --version
