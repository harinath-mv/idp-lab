name: 04 secrets and variables

on:
  workflow_dispatch:

jobs:
  use-them:
    runs-on: ubuntu-latest
    steps:
      - name: A variable (not secret) - shown in clear text
        run: echo "Team name is ${{ vars.TEAM_NAME }}"

      - name: Fail early if the secret is missing
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error title=Missing secret::DEMO_API_KEY is empty - check the secret name and where it is defined"
            exit 1
          fi
          echo "Secret found, length ${#API_KEY} characters"

      - name: A secret - GitHub hides it in the log
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: echo "The key is $API_KEY"
